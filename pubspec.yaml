name: mausam
description: "Personalized Homepage for the Mausam Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  http: ^1.1.2
  intl: ^0.19.0
  uuid: ^4.2.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.example
